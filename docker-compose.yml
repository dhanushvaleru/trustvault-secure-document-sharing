version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: trustvault-db
    restart: always
    environment:
      POSTGRES_USER: trustvault
      POSTGRES_PASSWORD: trustvault_secure_db_password_2026
      POSTGRES_DB: trustvault
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustvault -d trustvault"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustvault-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://trustvault:trustvault_secure_db_password_2026@postgres:5432/trustvault?schema=public"
      SESSION_SECRET: "trustvault-production-high-entropy-secret-key-at-least-32-chars-long"
      COOKIE_SECURE: "true"
      STORAGE_DIR: "/app/storage"
      REGISTRATION_ENABLED: "true"
      DEMO_ACCOUNTS_ENABLED: "false" # Disabled for production security
      SESSION_TTL_HOURS: 8
      IDLE_TIMEOUT_MINUTES: 60
      MAX_FILE_SIZE_BYTES: 10485760
    ports:
      - "5000:5000"
    volumes:
      - document_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  document_storage:
